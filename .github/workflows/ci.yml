name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-test:
    uses: ./.github/workflows/lint-test.yml
    secrets: inherit

  android-build:
    runs-on: ubuntu-latest
    needs: lint-test
    env:
      VITE_ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # v4.0.2+ stopped installing the `tools` SDK package, which Google removed
      # from the repository — v3 fails the whole job on it.
      - uses: android-actions/setup-android@v4.0.4
      - run: npm ci
      - run: npm run build
      - run: npx capacitor sync android
      - run: ./gradlew assembleDebug
        working-directory: android

  play-internal:
    # GitHub withholds Actions secrets from runs Dependabot triggers, so there
    # is no signing material or store credential to upload with.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: [lint-test, android-build]
    env:
      VITE_ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: npm ci
      - run: npm run build
      - run: npx capacitor sync android
      - run: bundle exec fastlane android play_internal
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      - name: Clean signing material
        if: always()
        run: rm -rf build/android

  testflight:
    # GitHub withholds Actions secrets from runs Dependabot triggers, so there
    # is no signing material or store credential to upload with.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: macos-26
    needs: [lint-test, android-build]
    env:
      VITE_ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Show Xcode version
        run: xcodebuild -version
      - run: npm ci
      - run: npm run build
      - run: npx capacitor sync ios
      - run: bundle exec fastlane ios testflight_pr
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      - name: Clean signing material
        if: always()
        run: |
          rm -rf build/ios/signing
          security delete-keychain build.keychain-db 2>/dev/null || true
          security delete-keychain build.keychain 2>/dev/null || true
